workflows:
  react-native-android-unsigned:
    name: React Native Android Unsigned Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 14
      java: 8 
    scripts:
      - name: Set up environment
        script: |
          echo "Installing dependencies..."
          npm install --legacy-peer-deps
      - name: Verify Node and Java Versions
        script: |
          echo "Checking Node version..."
          node -v
          echo "Checking Java version..."
          java -version
      - name: Generate Android directory (if missing)
        script: |
          echo "Generating Android directory..."
          npx expo prebuild --platform android
      - name: Clean Gradle Cache
        script: |
          echo "Cleaning Gradle cache..."
          cd android
          ./gradlew clean
      - name: Build Android (Unsigned)
        script: |
          echo "Building unsigned Android app..."
          cd android
          ./gradlew assembleRelease -x bundleReleaseJsAndAssets
    artifacts:
      - android/app/build/outputs/apk/release/app-release-unsigned.apk
    publishing:
      email:
        recipients:
          - primapwd@gmail.com